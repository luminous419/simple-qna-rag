<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Q&A RAG System</title>
    <!-- CDN 대신 로컬 정적 자산으로 고정: package-lock.json에 잠긴 버전과
         frontend_tests/의 npm 패키지가 항상 동일한 코드를 참조하도록 함
         (scripts/sync-vendor.js가 node_modules에서 이 파일들을 생성) -->
    <script src="/static/vendor/marked.umd.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin-top: 60px;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .search-box {
            background: white;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 10px 25px;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        #questionInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.1em;
            padding: 15px;
            color: #333;
        }

        #questionInput::placeholder {
            color: #aaa;
        }

        #searchButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #searchButton:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #searchButton:active {
            transform: scale(0.98);
        }

        #searchButton:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 20px 0;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-top: 30px;
            display: none;
        }

        .result-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-section {
            margin-bottom: 30px;
        }

        .answer-section h2 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .answer-section h2::before {
            content: "📝";
            margin-right: 10px;
        }

        .answer-content {
            color: #333;
            line-height: 1.8;
            font-size: 1.05em;
        }

        .answer-content p {
            margin-bottom: 12px;
        }

        .answer-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .answer-content pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .sources-section {
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
            font-size: 0.9em;  /* 전체 섹션 폰트 크기 축소 */
        }

        .sources-section h2 {
            color: #764ba2;
            font-size: 1.3em;  /* 상대적 크기 유지 */
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .sources-section h2::before {
            content: "📚";
            margin-right: 10px;
        }

        .source-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        .source-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .source-item.hidden {
            display: none;
        }

        .show-more-container {
            text-align: right;
            margin-top: 10px;
        }

        .show-more-btn {
            background: none;
            border: none;
            color: #667eea;
            font-size: 0.9em;
            cursor: pointer;
            padding: 5px 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .show-more-btn:hover {
            color: #764ba2;
            transform: scale(1.05);
        }

        .show-more-btn .icon {
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }

        .show-more-btn.expanded .icon {
            transform: rotate(45deg);
        }

        .show-more-container.hidden {
            display: none;
        }

        .source-header {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        .source-content {
            font-size: 0.9em;
            color: #666;
            line-height: 1.5;
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #f44;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .container {
                margin-top: 30px;
            }

            .search-box {
                padding: 8px 15px;
            }

            #questionInput {
                font-size: 1em;
                padding: 10px;
            }

            #searchButton {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .result-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>오늘은 무슨 이야기를 할까요?</h1>

        <div class="search-box">
            <input
                type="text"
                id="questionInput"
                placeholder="무엇이든 물어보세요"
                autocomplete="off"
            >
            <button id="searchButton">검색</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>답변을 생성하고 있습니다...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="answer-section">
                <h2>답변</h2>
                <div class="answer-content" id="answerContent"></div>
            </div>

            <div class="sources-section" id="sourcesSection">
                <h2>참고 문서</h2>
                <div id="sourcesContent"></div>
                <div class="show-more-container hidden" id="showMoreContainer">
                    <button class="show-more-btn" id="showMoreBtn">
                        <span class="icon">+</span>
                        <span class="text">더보기</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>
</html>
