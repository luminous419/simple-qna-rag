name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      enable_m3_live_regression:
        description: >-
          NOT_ADOPTED under the current hosted/OCI policy (M4-OAR-REQ-004).
          This input exists only as a documented reactivation marker for a
          future, separately reviewed milestone. Setting it true today still
          resolves as a no-op informational job — it does not run live code,
          checkout the repository, or contact Ollama.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install uv
        run: python -m pip install "uv==0.8.15"

      - name: Install Python dependencies (locked, hash-verified)
        run: python -m pip install --require-hashes -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install project package
        run: python -m pip install -e . --no-deps

      - name: Check Python dependencies
        run: python -m pip check

      - name: Verify lock reproducibility and drift (M4.1 §8.2)
        run: bash scripts/compile_lock.sh --verify

      - name: Write dependency snapshot (M4.1 §8.3)
        run: python scripts/dependency_snapshot.py

      - name: Upload dependency snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-snapshot
          path: dependency_snapshot.json
          retention-days: 90

      - name: Smoke-test web server import
        run: python -c "from simple_qna_rag.web.server import app"

      - name: Run Python tests
        run: pytest -q

      - name: Validate golden dataset
        run: python -m evaluation.dataset validate evaluation/datasets/golden.jsonl

      - name: Verify settings_field_spec.md has no drift (M4.1 §4.1.1)
        run: python scripts/generate_field_spec.py --check

      - name: Verify logging callsite disposition has no drift (M4.1 §6.1)
        run: python scripts/logging_callsite_audit.py --check

      - name: Check markdown links
        run: python scripts/check_markdown_links.py

      - name: Verify M3 baseline files are unchanged
        run: git diff --exit-code -- evaluation/baselines/m3_initial.*

      - name: Write CI producer receipt (M4.3 evidence identity)
        if: success()
        run: python scripts/write_ci_producer_receipt.py --job python-tests --output ci_producer_receipt.json

      - name: Upload producer receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m43-evidence-python-tests
          path: ci_producer_receipt.json
          if-no-files-found: error
          retention-days: 90

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Sync vendored frontend assets
        run: npm run sync-vendor

      - name: Verify vendored assets are current
        run: git diff --exit-code -- web/static/vendor/

      - name: Write CI producer receipt (M4.3 evidence identity)
        if: success()
        run: python3 scripts/write_ci_producer_receipt.py --job frontend-tests --output ci_producer_receipt.json

      - name: Upload producer receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m43-evidence-frontend-tests
          path: ci_producer_receipt.json
          if-no-files-found: error
          retention-days: 90

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies (locked, hash-verified)
        run: python -m pip install --require-hashes -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install project package
        run: python -m pip install -e . --no-deps

      - name: Build test-stage image
        run: docker build --target test -f deploy/Dockerfile .

      - name: Build production-stage image
        run: docker build --target production -f deploy/Dockerfile -t simple-qna-rag:${{ github.sha }} .

      - name: Scan OCI layers
        run: python scripts/scan_image_layers.py --image simple-qna-rag:${{ github.sha }} --output layer_scan.json

      - name: Container security/mock smoke
        run: python scripts/container_smoke.py --image simple-qna-rag:${{ github.sha }} --output container_smoke.json

      - name: Write CI producer receipt
        if: success()
        run: python scripts/write_ci_producer_receipt.py --job container --payload layer_scan.json --payload container_smoke.json --output ci_producer_receipt.json

      - name: Upload container evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m43-evidence-container
          path: |
            layer_scan.json
            container_smoke.json
            ci_producer_receipt.json
          if-no-files-found: error
          retention-days: 90

  m43-deterministic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies (locked, hash-verified)
        run: python -m pip install --require-hashes -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install project package
        run: python -m pip install -e . --no-deps

      - name: Run M4.3 deterministic acceptance
        run: python scripts/run_m43_acceptance.py --profile deterministic --repeat 10 --seed 4303 --output m43.json

      - name: Run M4.3 negative control (expected exit 1)
        run: |
          set +e
          python scripts/run_m43_acceptance.py --profile deterministic --repeat 10 --seed 4303 --inject-evidence-mismatch --output m43-negative.json
          code=$?
          if [ "$code" -ne 1 ]; then echo "negative control did not fail as expected (exit=$code)"; exit 1; fi

      - name: Write CI producer receipt
        if: success()
        run: python scripts/write_ci_producer_receipt.py --job m43-deterministic --payload m43.json --payload m43-negative.json --output ci_producer_receipt.json

      - name: Upload deterministic evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m43-evidence-m43-deterministic
          path: |
            m43.json
            m43-negative.json
            ci_producer_receipt.json
          if-no-files-found: error
          retention-days: 90

  m4-assemble:
    needs: [python-tests, frontend-tests, container, m43-deterministic]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies (locked, hash-verified)
        run: python -m pip install --require-hashes -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install project package
        run: python -m pip install -e . --no-deps

      - name: Download python-tests evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: m43-evidence-python-tests, path: assemble/python-tests}

      - name: Download frontend-tests evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: m43-evidence-frontend-tests, path: assemble/frontend-tests}

      - name: Download container evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: m43-evidence-container, path: assemble/container}

      - name: Download m43-deterministic evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: m43-evidence-m43-deterministic, path: assemble/m43-deterministic}

      - name: Assemble M4 evidence and baseline
        run: >
          python scripts/assemble_m4_evidence.py --fresh-dir assemble
          --expected-sha ${{ github.sha }}
          --expected-run-id ${{ github.run_id }}
          --expected-run-attempt ${{ github.run_attempt }}
          --expected-workflow-path .github/workflows/ci.yml
          --expected-event ${{ github.event_name }}
          --needs-result python-tests=${{ needs.python-tests.result }}
          --needs-result frontend-tests=${{ needs.frontend-tests.result }}
          --needs-result container=${{ needs.container.result }}
          --needs-result m43-deterministic=${{ needs.m43-deterministic.result }}
          --evidence python-tests=assemble/python-tests/ci_producer_receipt.json
          --evidence frontend-tests=assemble/frontend-tests/ci_producer_receipt.json
          --evidence container=assemble/container/ci_producer_receipt.json
          --evidence m43-deterministic=assemble/m43-deterministic/ci_producer_receipt.json
          --output assemble/m4-baseline.json

      - name: Check M4 baseline state algebra
        run: python scripts/check_m4_baseline.py --candidate assemble/m4-baseline.json

      - name: Upload M4 baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-baseline
          path: assemble/m4-baseline.json
          if-no-files-found: error
          retention-days: 90

  # M4-OAR-REQ-004.2 — NOT_ADOPTED reactivation stub (Requirement.md,
  # Stop_Report.md §3/§5). This job never checks out the repository, never
  # requires a secret/environment approval, and never references a
  # self-hosted label. On ordinary push/pull_request its `if:` is always
  # false, so it is never scheduled (the run reaches a terminal conclusion
  # immediately — it does not sit queued). On workflow_dispatch it only runs
  # when the `enable_m3_live_regression` input is explicitly true, and even
  # then the single step below only prints the policy pointer and exits 0.
  # Reactivation requires a new policy decision, requirements/design review,
  # threat model, an owned native runner, and a separate implementation
  # (Stop_Report.md §4) — toggling this workflow_dispatch input alone
  # reactivates nothing.
  m3-live-regression-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.enable_m3_live_regression == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: NOT_ADOPTED — informational reactivation stub, no live execution
        run: |
          echo "::notice::m3-live-regression-gate is NOT_ADOPTED under the current hosted/OCI release policy."
          echo "This run performed no checkout, no secrets, no environment approval, and no self-hosted runner."
          echo "See docs/milestones/m4-operational-acceptance-recovery/Requirement.md and Stop_Report.md for the reactivation path."
          exit 0
