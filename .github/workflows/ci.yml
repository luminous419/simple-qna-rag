name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install uv
        run: python -m pip install "uv==0.8.15"

      - name: Install Python dependencies (locked, hash-verified)
        run: python -m pip install --require-hashes -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install project package
        run: python -m pip install -e . --no-deps

      - name: Check Python dependencies
        run: python -m pip check

      - name: Verify lock reproducibility and drift (M4.1 §8.2)
        run: bash scripts/compile_lock.sh --verify

      - name: Write dependency snapshot (M4.1 §8.3)
        run: python scripts/dependency_snapshot.py

      - name: Upload dependency snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-snapshot
          path: dependency_snapshot.json
          retention-days: 90

      - name: Smoke-test web server import
        run: python -c "from simple_qna_rag.web.server import app"

      - name: Run Python tests
        run: pytest -q

      - name: Validate golden dataset
        run: python -m evaluation.dataset validate evaluation/datasets/golden.jsonl

      - name: Verify settings_field_spec.md has no drift (M4.1 §4.1.1)
        run: python scripts/generate_field_spec.py --check

      - name: Verify logging callsite disposition has no drift (M4.1 §6.1)
        run: python scripts/logging_callsite_audit.py --check

      - name: Check markdown links
        run: python scripts/check_markdown_links.py

      - name: Verify M3 baseline files are unchanged
        run: git diff --exit-code -- evaluation/baselines/m3_initial.*

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Sync vendored frontend assets
        run: npm run sync-vendor

      - name: Verify vendored assets are current
        run: git diff --exit-code -- web/static/vendor/

  # CR-I1-MAJ-04 / CR-I2-MAJ-01 closure — M4.1 §10 authoritative M3 live
  # 14-gate regression.
  #
  # Trust boundary (CR-I2-MAJ-01 #2): this job never runs for `pull_request`
  # (fork or same-repo) — the `if:` below is an allow-list of exactly two
  # trusted entry points: a push to the protected `master` branch, or a
  # manually approved `workflow_dispatch` (only collaborators with write
  # access can dispatch). `environment: m3-live-regression` additionally
  # requires the repository owner to configure required reviewers on that
  # GitHub Environment, so both entry points gate on human approval before
  # any checkout or code execution happens on the self-hosted runner —
  # untrusted PR head code is never installed or executed here.
  #
  # Runner-local data (CR-I2-MAJ-01 #1): the vectorstore/documents directories
  # live at `SIMPLE_QNA_RAG_VECTORSTORE_DIR`/`SIMPLE_QNA_RAG_DOCUMENTS_DIR`,
  # fixed runner-local paths *outside* `$GITHUB_WORKSPACE` that the repository
  # owner provisions once (indexed, then made read-only for the runner's
  # service account) when registering the `ollama-m3` runner. Because these
  # paths are outside the checkout directory, `actions/checkout@v4`'s default
  # clean step never touches them — the previous "committed runtime/
  # vectorstore" assumption was false (`runtime/` is gitignored) and this
  # replaces it with an explicit external-artifact contract instead of
  # depending on checkout contents.
  #
  # Preflight (CR-I2-MAJ-01 #3): before the ~24+ minute live run starts,
  # `preflight_vectorstore.py` fails fast if either canonical file
  # (`index.faiss`/`index.pkl`) is missing and logs their sha256, and
  # `preflight_ollama.py` fails fast if the Ollama endpoint is unreachable or
  # the required model isn't registered. `timeout-minutes` bounds a hung run
  # and `concurrency` prevents overlapping live runs (push and a manual
  # dispatch racing) from corrupting the shared runner-local vectorstore.
  m3-live-regression-gate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: [self-hosted, ollama-m3]
    environment: m3-live-regression
    timeout-minutes: 45
    concurrency:
      group: m3-live-regression-gate
      cancel-in-progress: false
    env:
      SIMPLE_QNA_RAG_VECTORSTORE_DIR: /opt/simple-qna-rag-data/vectorstore
      SIMPLE_QNA_RAG_DOCUMENTS_DIR: /opt/simple-qna-rag-data/documents
      OLLAMA_BASE_URL: http://localhost:11434
      SIMPLE_QNA_RAG_OLLAMA_MODEL: gpt-oss:20b
      RUN_LIVE_LLM_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python dependencies (locked, hash-verified)
        run: python -m pip install --require-hashes -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install project package
        run: python -m pip install -e . --no-deps

      - name: Preflight — canonical vectorstore files (existence + sha256)
        run: python scripts/preflight_vectorstore.py "${SIMPLE_QNA_RAG_VECTORSTORE_DIR}"

      - name: Preflight — Ollama endpoint/model/version health
        run: python scripts/preflight_ollama.py "${OLLAMA_BASE_URL}" "${SIMPLE_QNA_RAG_OLLAMA_MODEL}"

      - name: Run M3 live 14-gate regression (RUN_LIVE_LLM_TESTS=1)
        run: python scripts/run_m4_regression_gate.py

      - name: Upload M4 regression report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-regression-report
          path: evaluation/reports/m4_regression/
          retention-days: 90
